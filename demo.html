<!doctype html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Trippy Plane Demo</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#120b2d;font-family:system-ui;color:white}canvas{width:100vw;height:100vh;display:block;touch-action:none}.ui{position:fixed;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}.card{pointer-events:auto;background:#170c38aa;padding:35px 48px;border-radius:28px;backdrop-filter:blur(8px);box-shadow:0 20px 80px #0006}.logo{font-size:clamp(42px,8vw,80px);font-weight:1000;line-height:.85;letter-spacing:-4px}.logo b{display:block;background:linear-gradient(90deg,#fff,#70eaff,#ff87ef);color:transparent;background-clip:text}.sub{margin:18px 0 24px;opacity:.85}button{border:0;border-radius:99px;padding:16px 30px;font-size:18px;font-weight:900;background:linear-gradient(90deg,#fff,#7feaff,#ff8deb);color:#24103e;cursor:pointer}.hint{display:block;margin-top:16px;font-size:12px;letter-spacing:2px;opacity:.7}.hide{display:none}</style></head>
<body><canvas id=c></canvas><div id=menu class=ui><div class=card><div class=logo>TRIPPY<b>PLANE</b></div><div class=sub>How long can you survive?</div><button id=start>START GAME</button><span class=hint>SPACE / CLICK / TAP TO FLY</span></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),menu=document.getElementById('menu');let dpr=1,W,H,p,obs,score,best=+localStorage.tpBest||0,run=false,t=0,world=0,spawn=0;
function size(){dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;W=innerWidth;H=innerHeight;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
function reset(){p={x:W*.2,y:H*.48,vy:0,a:0};obs=[];score=0;world=0;spawn=20;run=true;menu.classList.add('hide')}
function flap(){if(!run){reset();return}p.vy=-H*.013}
function input(e){if(e.code==='Space'){e.preventDefault();flap()}}addEventListener('keydown',input);c.addEventListener('pointerdown',e=>{e.preventDefault();flap()});document.getElementById('start').onclick=reset;
function crash(){run=false;best=Math.max(best,score);localStorage.tpBest=best;menu.classList.remove('hide');menu.querySelector('.logo').innerHTML='GAME<b>OVER</b>';menu.querySelector('.sub').textContent=`Score: ${score}  •  Best: ${best}`;menu.querySelector('button').textContent='PLAY AGAIN'}
function plane(){x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle='#fff';x.beginPath();x.ellipse(0,0,30,10,0,0,7);x.fill();x.fillStyle='#76dfff';x.beginPath();x.moveTo(-5,0);x.lineTo(8,25);x.lineTo(27,21);x.lineTo(13,0);x.fill();x.fillStyle='#2162b8';x.beginPath();x.ellipse(8,-6,11,6,0,0,7);x.fill();x.fillStyle='#ffb347';x.beginPath();x.ellipse(-31,5,16,5,0,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;let a=t*.15;x.beginPath();x.moveTo(33+Math.cos(a)*11,-Math.sin(a)*11);x.lineTo(33-Math.cos(a)*11,Math.sin(a)*11);x.stroke();x.restore()}
function frame(){t++;let prog=Math.min(score/100,1),g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,`hsl(${215+prog*80},75%,65%)`);g.addColorStop(1,`hsl(${280+prog*40},75%,76%)`);x.fillStyle=g;x.fillRect(0,0,W,H);
for(let L=0;L<3;L++){x.fillStyle=`hsla(${250+L*35},55%,45%,${.22+L*.1})`;x.beginPath();x.moveTo(0,H);for(let q=-100;q<W+150;q+=100){let xx=q-(world*(.12+L*.13)%100);x.lineTo(xx,360-L*55-(q%300)*.12);x.lineTo(xx+100,470-L*45)}x.lineTo(W,H);x.fill()}
world+=4+Math.min(score*.025,3.5);
for(let i=0;i<6;i++){let q=((i*210-world*.22)%(W+250)+W+250)%(W+250)-100;x.fillStyle='#fff5';x.beginPath();x.arc(q,70+i%3*80,25,0,7);x.arc(q+30,62+i%3*80,34,0,7);x.fill()}
if(run){p.vy=Math.min(9,p.vy+.36);p.y+=p.vy;p.a=Math.max(-.35,Math.min(.6,p.vy*.055));spawn--;if(spawn<=0){let gap=Math.max(110,190-score);let center=120+Math.random()*(H-240);obs.push({x:W+40,cy:center,g:gap,w:78,pass:false});spawn=Math.max(78,140-score*.4)}let sp=4+Math.min(score*.025,3.5);for(let o of obs)o.x-=sp;for(let o of obs){x.fillStyle='#552c83';x.beginPath();x.moveTo(o.x,0);x.lineTo(o.x+o.w/2,o.cy-o.g/2-35);x.lineTo(o.x+o.w,o.cy-o.g/2);x.lineTo(o.x+o.w,0);x.fill();x.fillStyle='#3d245f';x.beginPath();x.moveTo(o.x,H);x.lineTo(o.x+o.w/2,o.cy+o.g/2+35);x.lineTo(o.x+o.w,o.cy+o.g/2);x.lineTo(o.x+o.w,H);x.fill();if(!o.pass&&o.x+o.w<p.x){o.pass=true;score++}if(p.x+25>o.x&&p.x-25<o.x+o.w&&(p.y-9<o.cy-o.g/2||p.y+9>o.cy+o.g/2))crash()}obs=obs.filter(o=>o.x>-100);if(p.y<10||p.y>H-10)crash()}
x.fillStyle='#fff';x.font='800 22px system-ui';x.fillText('SCORE: '+score,22,36);x.textAlign='right';x.fillText('BEST: '+Math.max(best,score),W-22,36);x.textAlign='left';plane();requestAnimationFrame(frame)}frame();
</script></body></html>
